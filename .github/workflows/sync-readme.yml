name: Keep README model sections current

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/FORMAL_MODEL.md
      - docs/THREAT_MODEL.md
      - scripts/sync-readme.mjs
      - .github/workflows/sync-readme.yml
  pull_request:
    paths:
      - README.md
      - docs/FORMAL_MODEL.md
      - docs/THREAT_MODEL.md
      - scripts/sync-readme.mjs
      - .github/workflows/sync-readme.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check canonical README sections
        run: node scripts/sync-readme.mjs --check

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Regenerate canonical README sections
        run: node scripts/sync-readme.mjs
      - name: Check regenerated README
        run: node scripts/sync-readme.mjs --check
      - name: Commit only generated README changes
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: synchronize README with canonical models"
          git push origin HEAD:main
